<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2d5016">
  <meta name="application-name" content="Snake Game">
  <meta name="description" content="لعبة الثعبان">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake">
  <title>لعبة الثعبان</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <header>
      <div class="score-box"><span>🍎</span><strong id="score">0</strong></div>
      <div class="score-box"><span>🏆</span><strong id="best">0</strong></div>
    </header>
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">🐍 الثعبان</h1>
      <p id="overlay-msg">اسحب للتحكم</p>
      <button id="startBtn">ابدأ</button>
    </div>
  </div>

  <script>
    // تسجيل service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

    // محاولة تفعيل الشاشة الكاملة عند أول لمسة
    function goFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen ||
                  el.webkitRequestFullscreen ||
                  el.mozRequestFullScreen ||
                  el.msRequestFullscreen;
      if (req) {
        req.call(el).catch(function() {});
      }
      // إخفاء شريط الحالة على iOS
      if (window.navigator.standalone !== true) {
        window.scrollTo(0, 1);
      }
    }

    document.addEventListener('touchstart', goFullscreen, { once: true });
    document.addEventListener('click', goFullscreen, { once: true });
  </script>

  <script src="game.js"></script>
</body>
</html>
