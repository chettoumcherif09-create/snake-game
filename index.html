<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2d5016">
  <meta name="application-name" content="Snake Game">
  <meta name="description" content="لعبة الثعبان الكلاسيكية">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake">
  <title>🐍 لعبة الثعبان</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-wrapper">
    <header>
      <div class="score-box">
        <span>🍎</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-box">
        <span>🏆</span>
        <strong id="best">0</strong>
      </div>
    </header>

    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">🐍 الثعبان</h1>
      <p id="overlay-msg">اسحب إصبعك على الشاشة للتحكم</p>
      <button id="startBtn">ابدأ اللعب</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>

  <script src="game.js"></script>
</body>
</html>
